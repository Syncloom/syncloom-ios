name: Syncloom
options:
  bundleIdPrefix: world.syncloom
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
packages:
  SyncloomKit:
    path: ../syncloom-apple
settings:
  base:
    SWIFT_VERSION: "5.9"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Syncloom:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: SyncloomKit
      - target: SyncloomFileProvider
        embed: true
    entitlements:
      path: App/Syncloom.entitlements
      properties:
        com.apple.security.application-groups: ["group.world.syncloom"]
        keychain-access-groups: ["$(AppIdentifierPrefix)world.syncloom.shared"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Syncloom
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest: { UIApplicationSupportsMultipleScenes: false }
        UISupportsDocumentBrowser: false
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        SyncloomKeychainGroup: "$(AppIdentifierPrefix)world.syncloom.shared"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: world.syncloom.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  SyncloomFileProvider:
    type: app-extension
    platform: iOS
    sources: [FileProvider]
    dependencies:
      - package: SyncloomKit
    entitlements:
      path: FileProvider/SyncloomFileProvider.entitlements
      properties:
        com.apple.security.application-groups: ["group.world.syncloom"]
        keychain-access-groups: ["$(AppIdentifierPrefix)world.syncloom.shared"]
    info:
      path: FileProvider/Info.plist
      properties:
        CFBundleDisplayName: Syncloom
        SyncloomKeychainGroup: "$(AppIdentifierPrefix)world.syncloom.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FileProviderExtension"
          NSExtensionFileProviderDocumentGroup: "group.world.syncloom"
          NSExtensionFileProviderSupportsEnumeration: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: world.syncloom.ios.fileprovider
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Syncloom:
    build:
      targets: { Syncloom: all }
